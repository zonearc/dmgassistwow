name: Nightly build

# Builds downloadable zips with the newest data and publishes them to one rolling release, "nightly":
#   https://github.com/<owner>/<repo>/releases/tag/nightly
#   stable link: .../releases/download/nightly/DMGAssist.zip (DMGAssist and its Watchdog in one package)
# Runs on every push to main/foundation (so new work is downloadable minutes later), every night, and on demand.
# Data is regenerated from the latest SimulationCraft and WoWSims before the checks run; the weekly sync PRs keep
# the committed data in step. Versions: <toc version>.<run number>, e.g. 0.1.0.57.

on:
  push:
    branches: [main, foundation]
  schedule:
    - cron: "23 7 * * *"   # 07:23 UTC daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1 and luacheck
        run: |
          # The runners couldn't resolve Ubuntu's own servers for hours (2026-11-11). apt checks Ubuntu's signature on
          # every package, so any full mirror is as safe: use kernel.org's.
          for f in /etc/apt/sources.list.d/*.sources /etc/apt/sources.list; do
            if [ -f "$f" ]; then sudo sed -i -E 's#mirror\+file:/etc/apt/apt-mirrors\.txt#http://mirrors.edge.kernel.org/ubuntu/#g; s#https?://([a-z0-9.-]+\.)?(archive|security)\.ubuntu\.com/ubuntu/?#http://mirrors.edge.kernel.org/ubuntu/#g' "$f"; fi
          done
          sudo apt-get -o Acquire::Retries=3 -o Acquire::ForceIPv4=true update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::ForceIPv4=true install -y -qq lua5.1 liblua5.1-0-dev luarocks zip
          sudo luarocks install luacheck
      - name: Fetch SimC and WoWSims
        run: |
          ./scripts/fetch-simc.sh .libraries/simc
          ./scripts/fetch-wowsims.sh .libraries/wowsims
      - name: Regenerate data
        run: python3 tools/simc_import.py --simc .libraries/simc --wowsims .libraries/wowsims --summary .libraries/data-summary.md
      - name: Check and package
        run: |
          base=$(sed -n 's/^## Version: *//p' addons/DMGAssist/DMGAssist.toc | tr -d '\r')
          echo "VERSION=$base.${{ github.run_number }}" >> "$GITHUB_ENV"
          PACKAGE_VERSION="$base.${{ github.run_number }}" ./scripts/package.sh
      - name: Release notes
        run: |
          simc_m=$(git -C .libraries/simc/midnight log -1 --format='%h %cs')
          simc_f=$(git -C .libraries/simc/forever log -1 --format='%h %cs')
          ws=$(git -C .libraries/wowsims/forever log -1 --format='%h %cs')
          gd=$(git -C .libraries/wowsims/gamedata log -1 --format='%h %cs')
          {
            echo "**DMGAssist $VERSION** — built $(date -u '+%Y-%m-%d %H:%M UTC') from \`${GITHUB_SHA:0:7}\` (${GITHUB_REF_NAME})."
            echo
            echo "### Install"
            echo "Most players: install DMGAssist from CurseForge (https://www.curseforge.com/wow/addons/dmgassist); the CurseForge app keeps it up to date."
            echo
            echo "This page is the newest test build:"
            echo "1. Download **DMGAssist.zip** below (DMGAssist and its Watchdog in one package)."
            echo "2. Unzip it into \`World of Warcraft/_retail_/Interface/AddOns/\` (Forever: the same folder of the client you play)."
            echo "3. Restart the game (or /reload). Type \`/dmga\` to check it's loaded."
            echo
            echo "### Data in this build"
            echo "- SimulationCraft midnight \`$simc_m\`, forever \`$simc_f\`"
            echo "- Forever rotations: [WoWSims](https://wowsims.com/forever) \`$ws\`, Forever game data \`$gd\`"
            echo
            echo "Every check passed (syntax, lint, unit tests, fuzz test over every spec on both clients)."
          } > release-notes.md
      - name: Publish the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd tools && zip -qr ../dist/DMGAssist_Updater.zip updater)
          # Updated in place (never deleted): an updater checking during a delete + create got a 404.
          git tag -f nightly "$GITHUB_SHA"
          git push -f origin refs/tags/nightly
          if gh release view nightly >/dev/null 2>&1; then
            old=$(gh release view nightly --json assets --jq '.assets[].name' | grep -E -- '-[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+\.zip$' || true)
            gh release upload nightly dist/DMGAssist.zip dist/DMGAssist_Updater.zip \
              "dist/DMGAssist-$VERSION.zip" --clobber
            gh release edit nightly --prerelease --title "Nightly build ($VERSION)" --notes-file release-notes.md
            for a in $old; do
              case "$a" in *"-$VERSION.zip") ;; *) gh release delete-asset nightly "$a" --yes || true ;; esac
            done
          else
            gh release create nightly dist/DMGAssist.zip dist/DMGAssist_Updater.zip \
              "dist/DMGAssist-$VERSION.zip" \
              --target "$GITHUB_SHA" --prerelease --title "Nightly build ($VERSION)" --notes-file release-notes.md
          fi


  # Only one package is published: remove what earlier builds put in the releases (the compiled updater exe, which
  # Defender flags as a false positive, and the stand-alone Watchdog zips).
  clean-old-assets:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Delete old assets from the releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for tag in $(gh release list --limit 100 --json tagName --jq '.[].tagName'); do
            for a in $(gh release view "$tag" --json assets --jq '.assets[].name' | grep -E '^(DMGAssistUpdater\.exe|DMGAssist_Watchdog.*\.zip)$' || true); do
              gh release delete-asset "$tag" "$a" --yes && echo "removed $a from $tag"
            done
          done
