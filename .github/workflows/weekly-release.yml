name: Weekly release

# Once a week, the current nightly build becomes a numbered GitHub release (the repository's "Latest release"), with
# the list of changes since the previous weekly release. Skipped when nothing changed. Nothing is uploaded to
# CurseForge: that stays a manual, tagged release (release.yml).

on:
  schedule:
    - cron: "41 16 * * 2"   # Tuesdays 16:41 UTC
  workflow_dispatch:
  push:
    # A release right away, from any branch (schedules only run from the default branch): a "release-now-*" tag, or
    # "[release]" in the message of a pushed commit (after that commit's nightly build is published).
    tags: ["release-now-*"]
    branches: [main, foundation]

permissions:
  contents: write
  actions: read

concurrency:
  group: weekly-release

jobs:
  release:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for this commit's nightly build
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The whole nightly run for this commit (zips, then the compiled updater) must be finished: checking for
          # an existing exe let an earlier build's exe into a release.
          for i in $(seq 1 40); do
            state=$(gh run list --workflow nightly.yml --commit "$GITHUB_SHA" --json status,conclusion \
              --jq '.[0] | "\(.status)/\(.conclusion)"' 2>/dev/null || true)
            case "$state" in
              completed/success) exit 0 ;;
              completed/*) echo "The nightly build for $GITHUB_SHA ended: $state"; exit 1 ;;
            esac
            sleep 30
          done
          echo "The nightly build for $GITHUB_SHA did not finish in 20 minutes"; exit 1
      - name: Promote the nightly build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          title=$(gh release view nightly --json name --jq .name)
          version=$(echo "$title" | grep -oE '[0-9]+(\.[0-9]+)+' | head -1)
          sha=$(git rev-list -n 1 nightly)
          tag="build-$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Already released: $tag"; exit 0
          fi
          prev=$(git tag --list 'build-*' --sort=-creatordate | head -1)
          if [ -n "$prev" ] && [ "$(git rev-list -n 1 "$prev")" = "$sha" ]; then
            echo "No changes since $prev"; exit 0
          fi
          mkdir assets
          # One package (DMGAssist + DMGAssist_Watchdog) and release.json, the packager metadata addon managers
          # (WowUp and others) read to pick the zip: nothing else, so they can't pick the wrong file.
          gh release download nightly --dir assets --pattern 'DMGAssist.zip'
          mv assets/DMGAssist.zip "assets/DMGAssist-$version.zip"
          cat > assets/release.json <<JSON
          {"releases":[{"name":"DMGAssist","version":"$version","filename":"DMGAssist-$version.zip","nolib":false,
            "metadata":[{"flavor":"mainline","interface":120105}]}]}
          JSON
          {
            echo "**DMGAssist $version**: this week's build (the newest one is always the [nightly build](https://github.com/${{ github.repository }}/releases/tag/nightly))."
            echo
            echo "### Changes"
            if [ -n "$prev" ]; then range="$prev..$sha"; else range="$sha"; fi
            git log --no-merges --format='- %s' $range | head -60
            echo
            echo "### Install"
            echo "Unzip **DMGAssist-$version.zip** into \`World of Warcraft/_retail_/Interface/AddOns/\` (it holds DMGAssist and its Watchdog), or install it with WowUp from this repository's link: it updates by itself."
            echo
            echo "Stand-alone Windows updater (AutoHotkey v2 script, keeps retail and Forever up to date): [DMGAssist_Updater.zip](https://github.com/${{ github.repository }}/releases/download/nightly/DMGAssist_Updater.zip)."
          } > notes.md
          # GitHub has answered the first try with a 403 right after a build (a re-run passed): retry a few times.
          for try in 1 2 3; do
            if gh release create "$tag" assets/* --target "$sha" --title "DMGAssist $version" --notes-file notes.md --latest; then
              exit 0
            fi
            sleep 60
          done
          exit 1
