name: Weekly release

# Once a week (or on "[release]"), the current nightly build is uploaded to CurseForge, with the list of changes since
# the previous release, and tagged build-<version>. CurseForge is the only download for players: there is no GitHub
# release. Needs the CF_API_TOKEN (or CF_API_TOKEN2) secret and the repository variable CURSEFORGE_PUBLISH = "true";
# the file type is Alpha unless CURSEFORGE_RELEASE_TYPE says "beta" or "release". Skipped when nothing changed.

on:
  schedule:
    - cron: "41 16 * * 2"   # Tuesdays 16:41 UTC
  workflow_dispatch:
  push:
    # A release right away, from any branch (schedules only run from the default branch): a "release-now-*" tag, or
    # "[release]" in the message of a pushed commit (after that commit's nightly build is published).
    tags: ["release-now-*"]
    branches: [main, foundation]

permissions:
  contents: write
  actions: read

concurrency:
  group: weekly-release

jobs:
  release:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for this commit's nightly build
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The whole nightly run for this commit (zips, then the compiled updater) must be finished: checking for
          # an existing exe let an earlier build's exe into a release.
          for i in $(seq 1 40); do
            state=$(gh run list --workflow nightly.yml --commit "$GITHUB_SHA" --json status,conclusion \
              --jq '.[0] | "\(.status)/\(.conclusion)"' 2>/dev/null || true)
            case "$state" in
              completed/success) exit 0 ;;
              completed/*) echo "The nightly build for $GITHUB_SHA ended: $state"; exit 1 ;;
            esac
            sleep 30
          done
          echo "The nightly build for $GITHUB_SHA did not finish in 20 minutes"; exit 1
      - name: Promote the nightly build
        id: promote
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # Tags as they are now: the checkout fetched them before the nightly build moved its tag.
          git fetch -q -f origin 'refs/tags/*:refs/tags/*'
          title=$(gh release view nightly --json name --jq .name)
          version=$(echo "$title" | grep -oE '[0-9]+(\.[0-9]+)+' | head -1)
          sha=$(git rev-list -n 1 nightly)
          tag="build-$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Already released: $tag"; exit 0
          fi
          prev=$(git tag --list 'build-*' --sort=-creatordate | head -1)
          if [ -n "$prev" ] && [ "$(git rev-list -n 1 "$prev")" = "$sha" ]; then
            echo "No changes since $prev"; exit 0
          fi
          mkdir assets
          # One package (DMGAssist + DMGAssist_Watchdog). The Windows updater is only on the nightly page (family testers).
          gh release download nightly --dir assets --pattern 'DMGAssist.zip'
          mv assets/DMGAssist.zip "assets/DMGAssist-$version.zip"
          {
            echo "**DMGAssist $version**"
            echo
            echo "### Changes"
            if [ -n "$prev" ]; then range="$prev..$sha"; else range="$sha"; fi
            git log --no-merges --format='- %s' $range | head -60
            echo
            echo "Report a problem in game: /dmga report."
          } > notes.md
          # CurseForge is the one place players download releases (it keeps them updated): no GitHub release, only a
          # tag that marks what was released, so the next week's changes can be listed.
          git tag "$tag" "$sha"
          for try in 1 2 3; do
            if git push -q origin "refs/tags/$tag"; then
              echo "version=$version" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 30
          done
          exit 1
      - name: CurseForge
        if: steps.promote.outputs.version != '' && vars.CURSEFORGE_PUBLISH == 'true'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN || secrets.CF_API_TOKEN2 }}
          RELEASE_TYPE: ${{ vars.CURSEFORGE_RELEASE_TYPE || 'alpha' }}
        run: |
          if [ -z "$CF_API_TOKEN" ]; then echo "CF_API_TOKEN secret is not set: nothing uploaded"; exit 0; fi
          python3 tools/curseforge_upload.py --release-type "$RELEASE_TYPE" --changelog notes.md \
            "assets/DMGAssist-${{ steps.promote.outputs.version }}.zip"
