name: Weekly data sync

# Pulls the latest SimulationCraft priority lists (midnight + forever branches), SimC's spell data (cooldowns, charges,
# costs, and the spell interdependencies read from the spell descriptions) and WoWSims' Forever rotations and game
# data, regenerates addons/DMGAssist/Data and the coverage reports, and runs every check. If anything changed and
# every check passes, the result is committed straight to the working branch (no manual review) and that branch's
# build is started; the next weekly release ships it. If a check fails nothing is committed and the run fails, so
# the problem shows up in Actions (and to the weekly review session) instead of in players' hands.
# The branch is the repository variable SYNC_BRANCH, else "foundation".

on:
  schedule:
    - cron: "17 15 * * 3"   # Wednesdays 15:17 UTC, after the US/EU weekly resets
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: simc-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ vars.SYNC_BRANCH || 'foundation' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ vars.SYNC_BRANCH || 'foundation' }}
      - name: Install Lua 5.1 and luacheck
        run: |
          # security.ubuntu.com can be unreachable from the runners (2026-11-11, for hours): the main mirror carries the same
          # packages, so use it.
          sudo sed -i 's|https\?://security.ubuntu.com|http://azure.archive.ubuntu.com|g' /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y -qq lua5.1 liblua5.1-0-dev luarocks zip
          sudo luarocks install luacheck
      - name: Fetch SimC and WoWSims
        run: |
          ./scripts/fetch-simc.sh .libraries/simc
          ./scripts/fetch-wowsims.sh .libraries/wowsims
      - name: Import
        run: python3 tools/simc_import.py --simc .libraries/simc --wowsims .libraries/wowsims --summary .libraries/simc-summary.md
      - name: Check
        run: ./scripts/check.sh
      - name: Commit to the working branch and start its build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          paths="addons/DMGAssist/Data addons/DMGAssist/DMGAssist.toc data docs/coverage"
          if git diff --quiet -- $paths && [ -z "$(git ls-files --others --exclude-standard -- $paths)" ]; then
            echo "Nothing changed."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add -- $paths
          { echo "Weekly data sync (SimC + WoWSims)"; echo; head -c 6000 .libraries/simc-summary.md; } > /tmp/msg.txt
          git commit -q -F /tmp/msg.txt
          for i in 1 2 3 4; do
            if git push origin "HEAD:$BRANCH"; then pushed=1; break; fi
            sleep $((i * 5)); git pull -q --rebase origin "$BRANCH"
          done
          [ "$pushed" = 1 ] || { echo "push failed"; exit 1; }
          # a push made with this token starts no workflows: start the branch's build explicitly
          gh workflow run nightly.yml --ref "$BRANCH"
