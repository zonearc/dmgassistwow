name: CI

on:
  push:
  pull_request:

jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1 and luacheck
        run: |
          # security.ubuntu.com can be unreachable from the runners (2026-11-11, for hours): the main mirror carries the same
          # packages, so use it.
          sudo sed -i 's|https\?://security.ubuntu.com|http://azure.archive.ubuntu.com|g' /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
          sudo sed -i '/security.ubuntu.com/d' /etc/apt/apt-mirrors.txt 2>/dev/null || true
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y -qq lua5.1 liblua5.1-0-dev luarocks zip
          sudo luarocks install luacheck
      - name: Check
        run: ./scripts/check.sh
      - name: Package
        run: ./scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: addons
          path: dist/*.zip
